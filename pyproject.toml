[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mortality-benchmark"
version = "0.1.0"
description = "Reproducible benchmark of classical, neural and hybrid mortality forecasting models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Amine Manai" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "torch>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "ruff>=0.9",
]
documents = ["python-docx>=1.1"]

[project.urls]
Repository = "https://github.com/aminemanai2003/neural-mortality-benchmark"
Manuscript = "https://github.com/aminemanai2003/neural-mortality-benchmark/blob/main/paper/main.pdf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
