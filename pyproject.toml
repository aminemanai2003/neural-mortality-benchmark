[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mortality-benchmark"
version = "0.1.0"
description = "Benchmark of classical and neural Lee-Carter models for mortality forecasting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Amine Manai" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "torch>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
