classical:
  lee_carter:
    method: svd
    kt_model: rwd
  lee_miller:
    adjust_e0: true
  poisson_lc:
    max_iter: 500
    tol: 1.0e-6
  cbd:
    age_range: [60, 100]
  hyndman_ullah:
    n_components: 6
    smoothing: penalized_spline
  random_walk:
    drift: true
  frozen_rates: {}

neural:
  common:
    seed: 42
    epochs: 200
    patience: 20
    lr: 0.001
    weight_decay: 1.0e-4

  lstm_kt:
    hidden_size: 64
    num_layers: 2
    lookback: 20
  gru_kt:
    hidden_size: 64
    num_layers: 2
    lookback: 20
  bilstm_kt:
    hidden_size: 64
    num_layers: 2
    lookback: 20
  transformer_kt:
    d_model: 64
    nhead: 4
    num_layers: 2
    lookback: 20
  ffnn_embeddings:
    hidden_sizes: [128, 64, 32]
    embedding_dim: 8
  cnn_surface:
    channels: [16, 32, 64]
    kernel_size: 3

hybrid:
  lc_resnet:
    residual_hidden: [64, 32]
    shrinkage_lambda: 0.1
    multi_population: false
